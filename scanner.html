<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Scanner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📷</text></svg>">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  
  <!-- QR Scanner -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
      background: #f3f4f6;
      min-height: 100vh;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 { color: #1f2937; font-size: 1.5rem; margin: 0 0 20px 0; }
    #reader {
      width: 100%;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
    #reader video { width: 100% !important; border-radius: 8px; }
    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      word-break: break-all;
    }
    .status.success { background: #d1fae5; color: #065f46; }
    .status.error { background: #fee2e2; color: #991b1b; }
    .status.info { background: #dbeafe; color: #1e40af; }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    .info-box {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 15px;
      font-size: 0.85rem;
      color: #0369a1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📷 QR Code Scanner</h1>
    <div id="infoBox" class="info-box" style="display:none"></div>
    <div id="reader"></div>
    <div id="status" class="status info">Menyiapkan...</div>
    <button id="stopBtn" onclick="stopScanner()" disabled>Stop Scanner</button>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════
    // FIREBASE CONFIG - SAMA DENGAN APP ANDA
    // ═══════════════════════════════════════════════════════════
    const firebaseConfig = {
      apiKey: "AIzaSyAc2WnRK1TG96y1GmegH_VyJI_X4Zi0jxE",
      authDomain: "reservasi-efa36.firebaseapp.com",
      databaseURL: "https://reservasi-efa36-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "reservasi-efa36",
      storageBucket: "reservasi-efa36.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef123456"
    };

    // ═══════════════════════════════════════════════════════════
    // GLOBAL VARIABLES
    // ═══════════════════════════════════════════════════════════
    let html5QrcodeScanner = null;
    let isScanning = false;
    let scanId = '';
    let callbackUrl = '';
    let userName = '';
    let processType = 'fg-wh';
    let firebaseReady = false;
    let fbDb = null;

    // ═══════════════════════════════════════════════════════════
    // INITIALIZATION
    // ═══════════════════════════════════════════════════════════
    window.addEventListener('DOMContentLoaded', function() {
      console.log('🚀 Scanner page loaded');
      
      // ✅ Initialize Firebase
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        fbDb = firebase.database();
        firebaseReady = true;
        console.log('✅ Firebase initialized');
      } catch(e) {
        console.error('❌ Firebase init error:', e);
        showStatus('❌ Firebase error: ' + e.message, 'error');
        return;
      }
      
      // ✅ Get URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const callbackParam = urlParams.get('callback') || '';
      userName = urlParams.get('u') || 'User';
      
      console.log('📋 Callback param:', callbackParam);
      console.log('👤 User:', userName);
      
      // ✅ Decode callback URL
      if (callbackParam) {
        try {
          // Decode URL-encoded base64
          const decodedB64 = decodeURIComponent(callbackParam);
          console.log('📦 Decoded base64:', decodedB64);
          
          // Parse base64 to get callback data
          const callbackData = b64Dec(decodedB64);
          console.log('📦 Parsed callback data:', callbackData);
          
          if (callbackData && callbackData.url) {
            callbackUrl = callbackData.url;
            processType = callbackData.processType || 'fg-wh';
            scanId = callbackData.scanId || '';
            
            // Show info
            const infoBox = document.getElementById('infoBox');
            infoBox.style.display = 'block';
            infoBox.innerHTML = '👤 User: <strong>' + userName + '</strong><br>📋 Proses: <strong>' + processType + '</strong><br>🔑 Scan ID: <strong>' + scanId + '</strong>';
            
            console.log('✅ Callback URL:', callbackUrl);
            console.log('✅ Process type:', processType);
            console.log('✅ Scan ID:', scanId);
          } else {
            throw new Error('Invalid callback data structure');
          }
        } catch(e) {
          console.error('❌ Failed to decode callback:', e);
          showStatus('❌ Gagal decode callback: ' + e.message, 'error');
          return;
        }
      }
      
      if (!callbackUrl) {
        showStatus('❌ Callback URL tidak ditemukan!', 'error');
        return;
      }
      
      if (!scanId) {
        showStatus('❌ Scan ID tidak ditemukan!', 'error');
        return;
      }
      
      showStatus('📷 Menyiapkan kamera...', 'info');
      startScanner();
    });

    // ═══════════════════════════════════════════════════════════
    // BASE64 HELPERS
    // ═══════════════════════════════════════════════════════════
    function b64Dec(str) {
      if (!str) return null;
      try {
        var b64 = str.replace(/-/g,'+').replace(/_/g,'/');
        while (b64.length % 4) b64 += '=';
        return JSON.parse(decodeURIComponent(escape(atob(b64))));
      } catch(e) { 
        console.error('b64Dec error:', e);
        return null; 
      }
    }

    // ═══════════════════════════════════════════════════════════
    // SCANNER FUNCTIONS
    // ═══════════════════════════════════════════════════════════
    function startScanner() {
      if (isScanning) return;
      
      html5QrcodeScanner = new Html5Qrcode("reader");
      
      const config = { 
        fps: 10, 
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1.0
      };
      
      html5QrcodeScanner.start(
        { facingMode: "environment" }, 
        config,
        onScanSuccess,
        onScanFailure
      ).then(() => {
        isScanning = true;
        document.getElementById('stopBtn').disabled = false;
        showStatus('✅ Kamera aktif. Arahkan ke QR Code.', 'success');
        console.log('✅ Scanner started');
      }).catch(err => {
        console.error('❌ Failed to start scanner:', err);
        showStatus('❌ Gagal mengakses kamera: ' + err, 'error');
      });
    }

    function stopScanner() {
      if (!isScanning || !html5QrcodeScanner) return;
      
      html5QrcodeScanner.stop().then(() => {
        isScanning = false;
        document.getElementById('stopBtn').disabled = true;
        showStatus('⏸️ Scanner dihentikan', 'info');
      }).catch(err => {
        console.error('❌ Failed to stop scanner:', err);
      });
    }

    // ═══════════════════════════════════════════════════════════
    // ✅ SCAN SUCCESS - UPDATE FIREBASE
    // ═══════════════════════════════════════════════════════════
    function onScanSuccess(decodedText, decodedResult) {
  console.log('✅ SCAN SUCCESS:', decodedText);
  
  stopScanner();
  
  if (!callbackUrl) {
    showStatus('❌ Callback URL tidak ditemukan!', 'error');
    return;
  }
  
  // ✅ LANGSUNG tambahkan hasil scan ke callback URL
  // Format: callbackUrl + '&code=HASIL_SCAN'
  var separator = callbackUrl.indexOf('?') >= 0 ? '&' : '?';
  var finalUrl = callbackUrl + separator + 'code=' + encodeURIComponent(decodedText);
  
  console.log('🚀 Redirecting to:', finalUrl);
  showStatus('✅ Scan berhasil: ' + decodedText + '<br>🔄 Mengalihkan...', 'success');
  
  setTimeout(function() {
    window.top.location.href = finalUrl;
  }, 1000);
}

    function onScanFailure(error) {
      // Ignore
    }

    // ═══════════════════════════════════════════════════════════
    // HELPER
    // ═══════════════════════════════════════════════════════════
    function showStatus(message, type) {
      const statusEl = document.getElementById('status');
      if (statusEl) {
        statusEl.innerHTML = message;
        statusEl.className = 'status ' + (type || 'info');
      }
    }
  </script>
</body>
</html>
