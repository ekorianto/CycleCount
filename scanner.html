<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Scanner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📷</text></svg>">
  
  <!-- QR Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
      background: #f3f4f6;
      min-height: 100vh;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 { color: #1f2937; font-size: 1.5rem; margin: 0 0 20px 0; }
    #reader {
      width: 100%;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
    #reader video { width: 100% !important; border-radius: 8px; }
    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      word-break: break-all;
    }
    .status.success { background: #d1fae5; color: #065f46; }
    .status.error { background: #fee2e2; color: #991b1b; }
    .status.info { background: #dbeafe; color: #1e40af; }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    .info-box {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 15px;
      font-size: 0.85rem;
      color: #0369a1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📷 QR Code Scanner</h1>
    <div id="infoBox" class="info-box" style="display:none"></div>
    <div id="reader"></div>
    <div id="status" class="status info">Menyiapkan...</div>
    <button id="stopBtn" onclick="stopScanner()" disabled>Stop Scanner</button>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════
    // GLOBAL VARIABLES
    // ═══════════════════════════════════════════════════════════
    let html5QrcodeScanner = null;
    let isScanning = false;
    let callbackUrl = '';
    let userName = '';
    let processType = 'fg-wh';

    // ═══════════════════════════════════════════════════════════
    // BASE64 DECODE HELPER
    // ═══════════════════════════════════════════════════════════
    function b64Dec(str) {
      if (!str) return null;
      try {
        var b64 = str.replace(/-/g,'+').replace(/_/g,'/');
        while (b64.length % 4) b64 += '=';
        return JSON.parse(decodeURIComponent(escape(atob(b64))));
      } catch(e) { 
        console.error('b64Dec error:', e);
        return null; 
      }
    }

    // ═══════════════════════════════════════════════════════════
    // INITIALIZATION - FIXED VERSION
    // ═══════════════════════════════════════════════════════════
    window.addEventListener('DOMContentLoaded', function() {
      console.log('🚀 Scanner page loaded');
      
      try {
        // ✅ Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const callbackParam = urlParams.get('callback') || '';
        userName = urlParams.get('u') || 'User';
        
        console.log('📋 Raw callback param:', callbackParam);
        console.log('👤 User:', userName);
        
        // ✅ Decode callback parameter - bisa base64 ATAU URL-encoded
        if (callbackParam) {
          try {
            // Coba decode sebagai base64 JSON dulu (format yang dikirim app)
            let decodedData = null;
            
            // Cek apakah ini base64 encoded JSON
            if (callbackParam.match(/^[A-Za-z0-9_-]+={0,2}$/)) {
              // Ini kemungkinan base64
              decodedData = b64Dec(callbackParam);
              console.log('📦 Decoded as base64:', decodedData);
            }
            
            // Jika base64 gagal atau tidak valid, coba sebagai URL-encoded string
            if (!decodedData || !decodedData.url) {
              try {
                const decodedUrl = decodeURIComponent(callbackParam);
                console.log('📦 Decoded as URL:', decodedUrl);
                
                // Parse URL untuk extract parameter
                const urlObj = new URL(decodedUrl);
                decodedData = {
                  url: decodedUrl.split('?')[0],
                  params: {}
                };
                
                // Extract query parameters
                urlObj.searchParams.forEach((value, key) => {
                  decodedData.params[key] = value;
                });
                
                // Reconstruct full callback URL
                decodedData.callbackUrl = decodedUrl;
              } catch(e2) {
                console.error('❌ Failed to decode as URL:', e2);
              }
            }
            
            if (decodedData) {
              // Extract data
              if (decodedData.url) {
                callbackUrl = decodedData.url;
              } else if (decodedData.callbackUrl) {
                callbackUrl = decodedData.callbackUrl;
              }
              
              if (decodedData.processType) {
                processType = decodedData.processType;
              } else if (decodedData.params && decodedData.params.t) {
                processType = decodedData.params.t;
              }
              
              // Show info
              const infoBox = document.getElementById('infoBox');
              infoBox.style.display = 'block';
              infoBox.innerHTML = '👤 User: <strong>' + userName + '</strong><br>📋 Proses: <strong>' + processType + '</strong>';
              
              console.log('✅ Callback URL:', callbackUrl);
              console.log('✅ Process type:', processType);
            }
          } catch(e) {
            console.error('❌ Failed to decode callback:', e);
            showStatus('❌ Gagal decode callback: ' + e.message, 'error');
            return;
          }
        }
        
        if (!callbackUrl) {
          showStatus('❌ Callback URL tidak ditemukan! Silakan buka dari aplikasi.', 'error');
          return;
        }
        
        showStatus('📷 Menyiapkan kamera...', 'info');
        startScanner();
        
      } catch(e) {
        console.error('❌ Initialization error:', e);
        showStatus('❌ Error: ' + e.message, 'error');
      }
    });

    // ═══════════════════════════════════════════════════════════
    // SCANNER FUNCTIONS
    // ═══════════════════════════════════════════════════════════
    function startScanner() {
      if (isScanning) return;
      
      html5QrcodeScanner = new Html5Qrcode("reader");
      
      const config = { 
        fps: 10, 
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1.0
      };
      
      html5QrcodeScanner.start(
        { facingMode: "environment" }, 
        config,
        onScanSuccess,
        onScanFailure
      ).then(() => {
        isScanning = true;
        document.getElementById('stopBtn').disabled = false;
        showStatus('✅ Kamera aktif. Arahkan ke QR Code.', 'success');
        console.log('✅ Scanner started');
      }).catch(err => {
        console.error('❌ Failed to start scanner:', err);
        showStatus('❌ Gagal mengakses kamera: ' + err, 'error');
      });
    }

    function stopScanner() {
      if (!isScanning || !html5QrcodeScanner) return;
      
      html5QrcodeScanner.stop().then(() => {
        isScanning = false;
        document.getElementById('stopBtn').disabled = true;
        showStatus('⏸️ Scanner dihentikan', 'info');
      }).catch(err => {
        console.error('❌ Failed to stop scanner:', err);
      });
    }

    // ═══════════════════════════════════════════════════════════
    // ✅ SCAN SUCCESS - LANGSUNG REDIRECT DENGAN HASIL
    // ═══════════════════════════════════════════════════════════
    function onScanSuccess(decodedText, decodedResult) {
      console.log('✅ SCAN SUCCESS:', decodedText);
      
      stopScanner();
      
      if (!callbackUrl) {
        showStatus('❌ Callback URL tidak ditemukan!', 'error');
        return;
      }
      
      // ✅ Tambahkan hasil scan ke callback URL
      const separator = callbackUrl.indexOf('?') >= 0 ? '&' : '?';
      const finalUrl = callbackUrl + separator + 'code=' + encodeURIComponent(decodedText);
      
      console.log('🚀 Redirecting to:', finalUrl);
      showStatus('✅ Scan berhasil: ' + decodedText + '<br>🔄 Mengalihkan...', 'success');
      
      setTimeout(function() {
        window.top.location.href = finalUrl;
      }, 1000);
    }

    function onScanFailure(error) {
      // Ignore scan failures (normal saat tidak ada QR di frame)
    }

    // ═══════════════════════════════════════════════════════════
    // HELPER
    // ═══════════════════════════════════════════════════════════
    function showStatus(message, type) {
      const statusEl = document.getElementById('status');
      if (statusEl) {
        statusEl.innerHTML = message;
        statusEl.className = 'status ' + (type || 'info');
      }
    }
  </script>
</body>
</html>
