<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Permissions-Policy" content="camera=(self)">
<title>QR / Barcode Scanner — Cycle Count Pro GSSI</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; background: #0f172a; color: #f1f5f9;
font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
header {
  padding: 16px;
  background: linear-gradient(135deg, #1e40af, #2563eb);
  text-align: center;
  position: relative;
}
header .logo { font-size: 28px; margin-bottom: 2px; }
header h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
header .sub { font-size: 12px; opacity: .75; margin-top: 2px; }
.container { padding: 16px; max-width: 480px; margin: 0 auto; }
.info-card {
  background: rgba(255,255,255,.06);
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 12px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.info-card .icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }

/* ── Start button (shown first) ── */
.start-camera-box {
  text-align: center;
  padding: 40px 20px;
  background: rgba(255,255,255,.04);
  border-radius: 14px;
  border: 2px dashed rgba(37,99,235,.3);
  margin-bottom: 12px;
}
.start-camera-box .big-icon { font-size: 3.5rem; margin-bottom: 14px; }
.start-camera-box p { color: #94a3b8; font-size: 14px; margin: 0 0 18px; line-height: 1.5; }
.btn-start-camera {
  display: inline-block;
  padding: 14px 36px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: white;
  font-size: 17px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: transform .15s, box-shadow .2s;
  box-shadow: 0 4px 20px rgba(37,99,235,.35);
}
.btn-start-camera:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(37,99,235,.45); }
.btn-start-camera:active { transform: scale(.96); }

/* ── Scanner area (hidden until started) ── */
.scanner-area { display: none; }
#reader {
  width: 100%;
  max-width: 420px;
  margin: 0 auto 12px;
  border-radius: 12px;
  overflow: hidden;
  border: 2px solid rgba(37, 99, 235, .3);
}
#reader video { border-radius: 12px; }

#result {
  margin-top: 10px;
  padding: 14px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 16px;
  display: none;
  word-break: break-all;
  text-align: center;
}
#result.success { background: #059669; color: white; display: block; }
#result.error { background: #dc2626; color: white; display: block; }
#result.info { background: #2563eb; color: white; display: block; }

#countdown {
  display: none;
  text-align: center;
  margin-top: 8px;
  font-size: 13px;
  color: #94a3b8;
}

.camera-actions {
  display: none;
  gap: 8px;
  margin-top: 8px;
}
.camera-actions.show { display: flex; }
.camera-actions .btn { width: auto; flex: 1; padding: 10px; font-size: 13px; }

/* ── Manual input ── */
.manual-section {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid rgba(255,255,255,.08);
}
.manual-section label {
  display: block;
  font-size: 12px;
  opacity: .7;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: .04em;
}
input[type="text"] {
  width: 100%;
  padding: 12px 14px;
  font-size: 16px;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 8px;
  background: rgba(255,255,255,.06);
  color: #f1f5f9;
  font-family: inherit;
  outline: none;
  transition: border-color .2s;
}
input[type="text"]:focus { border-color: #3b82f6; }
input[type="text"]::placeholder { color: #64748b; }

.btn {
  display: block;
  width: 100%;
  padding: 13px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
  font-family: inherit;
  margin-top: 8px;
  transition: opacity .2s, transform .1s;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: #2563eb; color: white; }
.btn-primary:hover { opacity: .92; }
.btn-ghost {
  background: transparent;
  color: #94a3b8;
  border: 1px solid rgba(255,255,255,.1);
}
.btn-ghost:hover { background: rgba(255,255,255,.05); color: #f1f5f9; }

.status-bar {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  font-size: 12px;
  color: #64748b;
}
.status-bar .dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #dc2626;
}
.status-bar .dot.active { background: #22c55e; }
</style>
</head>
<body>
<header>
  <div class="logo">📋</div>
  <h1>Scan Barcode / QR</h1>
  <div class="sub">Cycle Count Pro — GSSI</div>
</header>
<div class="container">

  <div class="info-card">
    <span class="icon">📷</span>
    <span>Arahkan kamera ke barcode atau QR. Hasil scan akan otomatis dikirim ke app Cycle Count.</span>
  </div>

  <!-- ===== START BUTTON (ditampilkan pertama) ===== -->
  <div class="start-camera-box" id="startBox">
    <div class="big-icon">📸</div>
    <p>Klik tombol di bawah untuk mengaktifkan kamera.<br>
    Browser akan meminta izin — pilih <strong>Izinkan</strong>.</p>
    <button class="btn-start-camera" id="btnStartCamera" onclick="startCameraNow()">
      📷 Mulai Kamera
    </button>
  </div>

  <!-- ===== SCANNER AREA (muncul setelah klik) ===== -->
  <div class="scanner-area" id="scannerArea">
    <div id="reader"></div>
    <div id="result"></div>
    <div id="countdown">↩️ Mengembalikan ke app dalam <span id="countdownSec">2</span> detik...</div>
    <div class="camera-actions" id="cameraActions">
      <button class="btn btn-ghost" onclick="restartScanner()">🔄 Mulai Ulang</button>
      <button class="btn btn-ghost" onclick="switchCamera()">🔄 Ganti Kamera</button>
    </div>
  </div>

  <!-- ===== MANUAL INPUT ===== -->
  <div class="manual-section">
    <label>Atau ketik kode manual</label>
    <input type="text" id="manualInput" placeholder="Ketik kode material / barcode..." autocomplete="off" onkeydown="if(event.key==='Enter')submitManual()">
    <button class="btn btn-primary" onclick="submitManual()">✅ Gunakan Kode Ini</button>
  </div>

  <button class="btn btn-ghost" onclick="goBack()">← Kembali ke App</button>

  <div class="status-bar">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Siap</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
(function() {
  'use strict';
  var callback = null;
  var scanner = null;
  var currentCamId = null;
  var cameras = [];
  var isRedirecting = false;
  var redirectTimer = null;
  var cameraStarted = false;

  function getParam(key) {
    var u = new URL(window.location.href);
    return u.searchParams.get(key);
  }

  function init() {
    callback = getParam('callback');
    if (!callback) {
      showResult('Callback URL tidak ditemukan. Buka scanner dari app Cycle Count Pro.', 'error');
      setStatus('offline', 'Callback tidak ada');
      document.getElementById('startBox').style.display = 'none';
      return;
    }
    setStatus('waiting', 'Tekan tombol Mulai Kamera');
  }

  // ── Dipanggil saat user klik "Mulai Kamera" (user gesture!) ──
  window.startCameraNow = function() {
    if (cameraStarted) return;
    cameraStarted = true;

    // Langkah 1: minta izin kamera EXPLISIT dengan getUserMedia
    // (Browser butuh user gesture untuk ini — tombol klik menyediakannya)
    setStatus('waiting', 'Meminta izin kamera...');
    document.getElementById('btnStartCamera').textContent = '⏳ Meminta izin...';

    navigator.mediaDevices.getUserMedia({ video: true })
      .then(function(stream) {
        // Izin diberikan! Hentikan stream sementara, kita akan pakai html5-qrcode
        stream.getTracks().forEach(function(t) { t.stop(); });

        // Sembunyikan start box, tampilkan scanner area
        document.getElementById('startBox').style.display = 'none';
        document.getElementById('scannerArea').style.display = 'block';

        // Inisialisasi scanner
        initScanner();
      })
      .catch(function(err) {
        // Izin ditolak
        document.getElementById('btnStartCamera').textContent = '📷 Mulai Kamera';
        cameraStarted = false;
        setStatus('offline', 'Kamera ditolak');

        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
          showResult(
            '⚠️ Akses kamera DIBLOKIR oleh browser.<br><br>' +
            '📌 <strong>Cara memperbaiki (pilih salah satu):</strong><br><br>' +
            '🔹 <strong>CARA 1 — Klik ikon 🔒 di address bar</strong><br>' +
            '(samping kiri URL) → klik Site settings<br>' +
            '→ cari Camera → ubah Block → <strong>Allow</strong><br>' +
            '→ reload halaman ini<br><br>' +
            '🔹 <strong>CARA 2 — Buka pengaturan Chrome</strong><br>' +
            'Ketik di tab baru: <code>chrome://settings/content/camera</code><br>' +
            '→ pastikan "Sites can ask for camera" ON<br>' +
            '→ hapus github.io dari daftar Block<br><br>' +
            '🔹 <strong>CARA 3 — Coba incognito / browser lain</strong><br>' +
            'Buka URL ini di jendela Incognito (Ctrl+Shift+N)<br>' +
            'atau pakai Edge / Firefox<br><br>' +
            '✅ <strong>Atau gunakan input manual</strong> di bawah ↓',
            'error'
          );
        } else if (err.name === 'NotFoundError') {
          showResult('Tidak ada kamera ditemukan. Gunakan input manual di bawah.', 'info');
        } else {
          showResult('Gagal akses kamera: ' + err.message + '. Gunakan input manual.', 'error');
        }
      });
  };

  // ── Inisialisasi scanner setelah izin diberikan ──
  function initScanner() {
    setStatus('waiting', 'Menyiapkan scanner...');

    if (!window.Html5Qrcode) {
      showResult('Library scanner gagal dimuat. Coba refresh halaman.', 'error');
      setStatus('offline', 'Library error');
      document.getElementById('cameraActions').classList.add('show');
      return;
    }

    try {
      scanner = new Html5Qrcode('reader');
    } catch(e) {
      showResult('Gagal inisialisasi scanner: ' + e.message, 'error');
      setStatus('offline', 'Init error');
      document.getElementById('cameraActions').classList.add('show');
      return;
    }

    Html5Qrcode.getCameras().then(function(cams) {
      cameras = cams || [];
      if (cameras.length === 0) {
        showResult('Tidak ada kamera ditemukan. Gunakan input manual.', 'info');
        setStatus('offline', 'No camera');
        return;
      }
      document.getElementById('cameraActions').classList.add('show');
      var backCam = cameras.find(function(c) { return /back|rear|environment/i.test(c.label); });
      var targetCam = backCam || cameras[0];
      currentCamId = targetCam.id;
      startCamera(currentCamId);
    }).catch(function(err) {
      showResult('Gagal mendeteksi kamera: ' + err + '. Gunakan input manual.', 'info');
      setStatus('offline', 'Camera error');
      document.getElementById('cameraActions').classList.add('show');
    });
  }

  function startCamera(camId) {
    setStatus('waiting', 'Mengaktifkan kamera...');
    var config = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };
    var onSuccess = function(decodedText) {
      if (isRedirecting) return;
      isRedirecting = true;
      try { scanner.stop(); } catch(e) {}
      showResult('✅ ' + decodedText, 'success');
      setStatus('active', 'Scan berhasil!');
      document.getElementById('cameraActions').classList.remove('show');
      var sec = 2;
      document.getElementById('countdown').style.display = 'block';
      document.getElementById('countdownSec').textContent = sec;
      redirectTimer = setInterval(function() {
        sec--;
        if (sec <= 0) {
          clearInterval(redirectTimer);
          returnToApp(decodedText);
        } else {
          document.getElementById('countdownSec').textContent = sec;
        }
      }, 1000);
    };
    var onFailure = function() {};
    try {
      scanner.start({ deviceId: { exact: camId } }, config, onSuccess, onFailure);
      setStatus('active', 'Kamera aktif — arahkan ke barcode');
    } catch(e) {
      try {
        scanner.start({ facingMode: 'environment' }, config, onSuccess, onFailure);
        setStatus('active', 'Kamera aktif — arahkan ke barcode');
      } catch(e2) {
        showResult('Gagal mengakses kamera: ' + e2.message + '. Gunakan input manual.', 'error');
        setStatus('offline', 'Camera failed');
      }
    }
  }

  window.switchCamera = function() {
    if (isRedirecting || !scanner || cameras.length < 2) return;
    try { scanner.stop(); } catch(e) {}
    var currentIdx = cameras.findIndex(function(c) { return c.id === currentCamId; });
    var nextIdx = (currentIdx + 1) % cameras.length;
    currentCamId = cameras[nextIdx].id;
    setStatus('waiting', 'Ganti kamera...');
    startCamera(currentCamId);
  };

  window.restartScanner = function() {
    isRedirecting = false;
    cameraStarted = false;
    if (redirectTimer) { clearInterval(redirectTimer); redirectTimer = null; }
    document.getElementById('scannerArea').style.display = 'none';
    document.getElementById('startBox').style.display = 'block';
    document.getElementById('btnStartCamera').textContent = '📷 Mulai Kamera';
    document.getElementById('countdown').style.display = 'none';
    document.getElementById('result').style.display = 'none';
    document.getElementById('cameraActions').classList.remove('show');
    setStatus('waiting', 'Tekan tombol Mulai Kamera');
  };

  function returnToApp(code) {
    if (!code || !callback) return;
    var separator = callback.indexOf('?') >= 0 ? '&' : '?';
    var url = callback + separator + 'code=' + encodeURIComponent(code);
    window.location.href = url;
  }

  window.submitManual = function() {
    var input = document.getElementById('manualInput');
    var val = input ? input.value.trim() : '';
    if (!val) { input.focus(); return; }
    returnToApp(val);
  };

  window.goBack = function() {
    if (isRedirecting) {
      clearInterval(redirectTimer);
      isRedirecting = false;
    }
    document.getElementById('countdown').style.display = 'none';
    if (callback) { window.location.href = callback; }
    else { window.history.back(); }
  };

  function showResult(text, type) {
    var el = document.getElementById('result');
    el.className = '';
    el.classList.add(type || 'info');
    el.innerHTML = text;
    el.style.display = 'block';
  }

  function setStatus(state, text) {
    var dot = document.getElementById('statusDot');
    var label = document.getElementById('statusText');
    dot.className = 'dot' + (state === 'active' ? ' active' : '');
    label.textContent = text || '';
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
