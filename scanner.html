<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scan Barcode — Cycle Count Pro GSSI</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; background: #0f172a; color: white;
font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
header { padding: 14px 16px; background: linear-gradient(135deg, #1e40af, #2563eb); }
header h1 { margin: 0; font-size: 17px; }
header .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
#reader { width: 100%; max-width: 480px; margin: 12px auto; border-radius: 12px; overflow: hidden; }
.container { padding: 16px; max-width: 480px; margin: 0 auto; }
.info { background: rgba(255,255,255,.06); padding: 12px; border-radius: 10px; font-size: 13px; line-height: 1.5; margin-bottom: 10px; }
.row { margin-bottom: 10px; }
label { display: block; font-size: 12px; opacity: .8; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .03em; }
input { width: 100%; padding: 12px; font-size: 16px; border: 1px solid rgba(255,255,255,.15); border-radius: 8px;
background: rgba(255,255,255,.06); color: white; font-family: inherit; }
.btn { display: block; width: 100%; padding: 13px; border-radius: 8px; border: none; cursor: pointer;
font-size: 15px; font-weight: 600; font-family: inherit; margin-top: 8px; }
.btn-primary { background: #2563eb; color: white; }
.btn-ghost { background: transparent; color: white; border: 1px solid rgba(255,255,255,.2); }
#result { margin-top: 12px; padding: 12px; background: #059669; border-radius: 10px; font-weight: 700; display: none; word-break: break-all; }
.err { background: #dc2626 !important; }
</style>
</head>
<body>
<header>
<h1>📷 Scan Barcode</h1>
<div class="sub">Cycle Count Pro — GSSI</div>
</header>
<div class="container">
<div class="info">
Arahkan kamera ke barcode material. Hasil scan otomatis kembali ke app Cycle Count.<br>
Jika kamera tidak muncul, izinkan akses kamera di browser.
</div>
<div id="reader"></div>
<div id="result"></div>
<div class="row" style="margin-top:14px">
<label>Atau ketik manual</label>
<input type="text" id="manual" placeholder="ketik kode material">
<button class="btn btn-primary" onclick="submitManual()">✅ Pakai kode ini</button>
</div>
<button class="btn btn-ghost" onclick="goBack()">← Kembali ke App</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
function getParam(k) {
var u = new URL(window.location.href);
return u.searchParams.get(k);
}
var callback = getParam('callback');
if (!callback) {
document.getElementById('result').className = 'err';
document.getElementById('result').style.display = 'block';
document.getElementById('result').textContent = 'Callback URL tidak ada. Buka scanner dari app Cycle Count Pro.';
}
function returnToApp(code) {
if (!callback) {
document.getElementById('result').textContent = 'Code: ' + code + ' (no callback)';
return;
}
var sep = callback.indexOf('?') >= 0 ? '&' : '?';
window.location.href = callback + sep + 'code=' + encodeURIComponent(code);
}
function submitManual() {
var v = document.getElementById('manual').value.trim();
if (!v) return;
returnToApp(v);
}
function goBack() {
if (callback) window.location.href = callback;
else window.history.back();
}
// === Init scanner ===
var scanner = null;
function startScanner() {
if (!window.Html5Qrcode) return;
scanner = new Html5Qrcode("reader");
Html5Qrcode.getCameras().then(function(cams){
var camId = cams && cams.length ? (cams.find(function(c){ return /back|rear|environment/i.test(c.label); }) || cams[cams.length-1]).id : null;
var conf = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };
var cb = function(decodedText) {
try { scanner.stop(); } catch(e){}
var r = document.getElementById('result');
r.textContent = '✅ ' + decodedText;
r.style.display = 'block';
setTimeout(function(){ returnToApp(decodedText); }, 350);
};
if (camId) scanner.start({ deviceId: { exact: camId } }, conf, cb, function(){});
else scanner.start({ facingMode: 'environment' }, conf, cb, function(){});
}).catch(function(e){
var r = document.getElementById('result');
r.className = 'err'; r.style.display = 'block';
r.textContent = 'Tidak bisa akses kamera: ' + e;
});
}
startScanner();
</script>
</body>
</html>
