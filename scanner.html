<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Scanner</title>
  
  <!-- Library QR Scanner -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
      background: #f3f4f6;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 {
      color: #1f2937;
      font-size: 1.5rem;
      margin-top: 0;
    }
    #reader {
      width: 100%;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      overflow: hidden;
    }
    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .status.success {
      background: #d1fae5;
      color: #065f46;
    }
    .status.error {
      background: #fee2e2;
      color: #991b1b;
    }
    .status.info {
      background: #dbeafe;
      color: #1e40af;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📷 QR Code Scanner</h1>
    <div id="reader"></div>
    <div id="status" class="status info">Menunggu scan...</div>
    <button id="stopBtn" onclick="stopScanner()" disabled>Stop Scanner</button>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════
    // GLOBAL VARIABLES
    // ═══════════════════════════════════════════════════════════
    let html5QrcodeScanner = null;
    let isScanning = false;
    let callbackUrl = '';
    let userName = '';

    // ═══════════════════════════════════════════════════════════
    // INITIALIZATION
    // ═══════════════════════════════════════════════════════════
    window.addEventListener('DOMContentLoaded', function() {
      console.log('🚀 Scanner page loaded');
      
      // ✅ Ambil parameter dari URL
      const urlParams = new URLSearchParams(window.location.search);
      callbackUrl = urlParams.get('callback') || '';
      userName = urlParams.get('u') || 'User';
      
      console.log('📋 Callback URL:', callbackUrl);
      console.log('👤 User:', userName);
      
      if (!callbackUrl) {
        showStatus('❌ Callback URL tidak ditemukan! Silakan buka dari aplikasi.', 'error');
        return;
      }
      
      showStatus('📷 Menyiapkan kamera...', 'info');
      startScanner();
    });

    // ═══════════════════════════════════════════════════════════
    // SCANNER FUNCTIONS
    // ═══════════════════════════════════════════════════════════
    function startScanner() {
      if (isScanning) return;
      
      html5QrcodeScanner = new Html5Qrcode("reader");
      
      const config = { 
        fps: 10, 
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1.0
      };
      
      html5QrcodeScanner.start(
        { facingMode: "environment" }, 
        config,
        onScanSuccess,
        onScanFailure
      ).then(() => {
        isScanning = true;
        document.getElementById('stopBtn').disabled = false;
        showStatus('✅ Kamera aktif. Arahkan ke QR Code.', 'success');
        console.log('✅ Scanner started');
      }).catch(err => {
        console.error('❌ Failed to start scanner:', err);
        showStatus('❌ Gagal mengakses kamera: ' + err, 'error');
      });
    }

    function stopScanner() {
      if (!isScanning || !html5QrcodeScanner) return;
      
      html5QrcodeScanner.stop().then(() => {
        isScanning = false;
        document.getElementById('stopBtn').disabled = true;
        showStatus('⏸️ Scanner dihentikan', 'info');
        console.log('⏸️ Scanner stopped');
      }).catch(err => {
        console.error('❌ Failed to stop scanner:', err);
      });
    }

    // ═══════════════════════════════════════════════════════════
    // ✅ SCAN SUCCESS HANDLER — INI YANG PENTING!
    // ═══════════════════════════════════════════════════════════
    function onScanSuccess(decodedText, decodedResult) {
      console.log('✅ SCAN SUCCESS:', decodedText);
      console.log('📦 Result object:', decodedResult);
      
      // Stop scanner agar tidak scan berulang
      stopScanner();
      
      // ✅ Cek apakah callback URL ada
      if (!callbackUrl) {
        showStatus('❌ Callback URL tidak ditemukan!', 'error');
        return;
      }
      
      // ✅ Tambahkan hasil scan ke callback URL
      // Format: callbackUrl + &code=HASIL_SCAN
      const finalUrl = callbackUrl + '&code=' + encodeURIComponent(decodedText);
      
      console.log('🚀 Redirecting to:', finalUrl);
      
      showStatus('✅ Scan berhasil: ' + decodedText + '<br>🔄 Mengalihkan kembali ke aplikasi...', 'success');
      
      // ✅ Redirect setelah 1 detik (kasih waktu user lihat hasil)
      setTimeout(function() {
        window.top.location.href = finalUrl;
      }, 1000);
    }

    function onScanFailure(error) {
      // Ignore scan failures (normal saat tidak ada QR di frame)
      // console.warn('Scan failure:', error);
    }

    // ═══════════════════════════════════════════════════════════
    // HELPER FUNCTIONS
    // ═══════════════════════════════════════════════════════════
    function showStatus(message, type) {
      const statusEl = document.getElementById('status');
      if (statusEl) {
        statusEl.innerHTML = message;
        statusEl.className = 'status ' + (type || 'info');
      }
    }
  </script>
</body>
</html>
